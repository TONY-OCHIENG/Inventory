<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="540" height="120" role="img" aria-label="IMS - Inventory Management System" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
  </defs>

  <!-- Icon tile -->
  <rect x="0" y="0" width="120" height="120" rx="28" fill="url(#bg)"/>

  <!-- Isometric box -->
  <polygon points="60,26 90,43 60,60 30,43" fill="#DCFCE7"/>
  <polygon points="30,43 60,60 60,94 30,77" fill="#BBF7D0"/>
  <polygon points="90,43 60,60 60,94 90,77" fill="#FFFFFF" fill-opacity="0.95"/>

  <!-- Tape line on the box top -->
  <polygon points="60,26 66,29.5 36,46.5 30,43" fill="#16A34A" fill-opacity="0.35"/>

  <!-- Wordmark -->
  <text x="148" y="68" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="2" fill="#14532D">IMS</text>
  <rect x="150" y="80" width="40" height="5" rx="2.5" fill="#4ADE80"/>
  <text x="150" y="104" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="1.2" fill="#4B6B57">INVENTORY MANAGEMENT SYSTEM</text>
</svg>
